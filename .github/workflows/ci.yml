name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  cargo-features:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - name: checkout w/ tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: cargo ${{ matrix.subcommand }} ${{ matrix.feature }}
    strategy:
      matrix:
        feature:
          - ''
          - --features build
          - --features clap
          - --features compression
          - --features build,clap
          - --all-features
        subcommand:
          - build
          - clippy --all-targets
          - doc --no-deps
          - test

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: runtime half has no dependencies
        run: |
          test "$(
            cargo tree --no-default-features --edges normal | wc -l
          )" -eq 1

  thirdparty:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: cargo run -p xtask

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-deny@0.20.2

      - run: cargo deny check advisories licenses

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install the declared minimum toolchain
        run: |
          set -euo pipefail

          MSRV="$(awk -F'"' '/^rust-version = / { print $2; exit }' \
                  Cargo.toml)"
          rustup toolchain install "$MSRV" --profile minimal
          rustup default "$MSRV"

      - run: cargo check --locked --all-features

  cffconvert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker://citationcff/cffconvert@sha256:f8c5dc5fa8013e5c3635b1c2695bf54eac4d319719f8acdbb7b7ad7a778e46ea # 2.0.0
        with:
          args: --validate -i CITATION.cff

  renovate-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: |
          npx -p renovate \
              -c 'renovate-config-validator renovate.json --strict' \
              -y

  formatting:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: cargo fmt --check

  release-level:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: rustup update

      - name: checkout w/ tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-semver-checks@0.50.0

      - name: compute the required release level
        id: level
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          field() {
            awk -F'"' -v want="$1" '/^\[/ { s = $0 }
                 s == want && /^version = / { print $2; exit }'
          }

          level='patch'

          raise() {
            case "$1" in
              major) level=major ;;
              minor) [ "$level" = major ] || level=minor ;;
            esac
          }

          LAST="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$LAST" ]; then
            echo "no baseline tag yet; nothing to measure against"
            exit 0
          fi
          BASE="${LAST#v}"
          echo "the baseline is $LAST"

          combos=(
            '--default-features'
            '--only-explicit-features --features clap'
            '--only-explicit-features --features compression'
            '--only-explicit-features --features clap,compression'
            '--only-explicit-features --features build'
            '--only-explicit-features --features build,clap'
            '--only-explicit-features --features build,compression'
            '--only-explicit-features --features build,clap,compression'
            '--only-explicit-features'
          )

          for combo in "${combos[@]}"; do
            echo "::group::cargo-semver-checks $combo"
            read -ra flags <<< "$combo"
            report="$(env -u CI cargo semver-checks --baseline-rev "$LAST" \
                      --release-type patch "${flags[@]}" 2>&1 || true)"
            echo "$report"
            echo '::endgroup::'

            case "$report" in
              *'requires new major version'*) raise major ;;
              *'requires new minor version'*) raise minor ;;
              *'no semver update required'*) ;;
              *) echo 'no verdict from cargo-semver-checks'; exit 1 ;;
            esac
          done

          OLD_MSRV="$(git show "$LAST:Cargo.toml" |
                      awk -F'"' '/^rust-version = / { print $2; exit }')"
          NEW_MSRV="$(awk -F'"' '/^rust-version = / { print $2; exit }' \
                      Cargo.toml)"

          if [ "$OLD_MSRV" != "$NEW_MSRV" ] &&
             [ "$(printf '%s\n%s\n' "$OLD_MSRV" "$NEW_MSRV" |
                  sort -V | tail -1)" = "$NEW_MSRV" ]
          then
            echo "the minimum toolchain rose from $OLD_MSRV to $NEW_MSRV"
            raise minor
          fi

          OLD_TOML="$(git show "$LAST:Cargo.toml")"
          NEW_TOML="$(cat Cargo.toml)"

          major_of() {
            local toml="$1" name="$2" v
            v="$(printf '%s\n' "$toml" | field "[dependencies.$name]")"

            if [ -z "$v" ]; then
              v="$(printf '%s\n' "$toml" |
                   awk -F'"' -v want="$name = " \
                       'index($0, want) == 1 { print $2; exit }')"
            fi

            printf '%s\n' "$v" | cut -d. -f1 | tr -cd '0-9'
          }

          for dep in clap cargo_metadata; do
            OLD_MAJOR="$(major_of "$OLD_TOML" "$dep")"
            NEW_MAJOR="$(major_of "$NEW_TOML" "$dep")"

            if [ -n "$OLD_MAJOR" ] && [ -n "$NEW_MAJOR" ] &&
               [ "$NEW_MAJOR" -gt "$OLD_MAJOR" ]
            then
              echo "$dep is required at $NEW_MAJOR, was $OLD_MAJOR"
              raise major
            fi
          done

          IFS=. read -r MAJ MIN PAT <<< "$BASE"

          if [ "$MAJ" -eq 0 ]; then
            case "$level" in
              major) EXPECTED="0.$((MIN + 1)).0" ;;
              *) EXPECTED="0.$MIN.$((PAT + 1))" ;;
            esac
          else
            case "$level" in
              major) EXPECTED="$((MAJ + 1)).0.0" ;;
              minor) EXPECTED="$MAJ.$((MIN + 1)).0" ;;
              *) EXPECTED="$MAJ.$MIN.$((PAT + 1))" ;;
            esac
          fi

          ACTUAL="$(field '[package]' < Cargo.toml)"
          echo "$LAST plus a $level step is $EXPECTED; the manifest says"
          echo "$ACTUAL"

          if [ "$ACTUAL" = "$EXPECTED" ] || [ "$ACTUAL" = 1.0.0 ]; then
            echo "mismatch=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          correctable=no
          if [ "$EVENT_NAME" = pull_request ] &&
             [ "$HEAD_REPO" = "$BASE_REPO" ]
          then
            correctable=yes
          fi

          if [ "$correctable" = no ]; then
            echo "This change asks for a $level release over $BASE, so the"
            echo "manifest has to say $EXPECTED and says $ACTUAL instead."
            echo "Set the version of the package in Cargo.toml, the"
            echo "list-my-licence entry in Cargo.lock and the version field"
            echo "of CITATION.cff to $EXPECTED."
            exit 1
          fi

          echo "self-correcting: $ACTUAL -> $EXPECTED"
          {
            echo "mismatch=yes"
            echo "expected=$EXPECTED"
          } >> "$GITHUB_OUTPUT"

      - if: steps.level.outputs.mismatch == 'yes'
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-release@1.1.5

      - if: steps.level.outputs.mismatch == 'yes'
        uses: fregante/setup-git-user@024bc0b8e177d7e77203b48dab6fb45666854b35 # v2.0.2

      - if: steps.level.outputs.mismatch == 'yes'
        name: bump the manifest to the required release level
        env:
          EXPECTED: ${{ steps.level.outputs.expected }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git checkout -B "$HEAD_REF"
          cargo release "$EXPECTED" --execute --no-confirm
          git push origin "HEAD:$HEAD_REF"

  changelog-fragment:
    runs-on: ubuntu-latest
    env:
      GIT_HARVEST_VERSION: "0.3.1"
    steps:
      - if: github.event_name == 'pull_request'
        run: rustup update

      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: github.event_name == 'pull_request'
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/git-harvest
          key: git-harvest-${{ env.GIT_HARVEST_VERSION }}-${{ runner.os }}

      - if: >-
          github.event_name == 'pull_request'
          && steps.cache.outputs.cache-hit != 'true'
        run: cargo install git-harvest --version "$GIT_HARVEST_VERSION" --locked

      - if: github.event_name == 'pull_request'
        name: a Bucket ::= commit is matched by a committed fragment
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          harvested=no
          while IFS= read -r subject; do
            case "$subject" in
              'Added ::= '* | 'Changed ::= '* | 'Deprecated ::= '* | \
              'Fixed ::= '* | 'Removed ::= '* | 'Security ::= '*)
                harvested=yes ;;
            esac
          done < <(git log --format='%s' "$BASE..$HEAD")

          added=$(git diff --no-renames --diff-filter=A --name-only \
                  "$BASE...$HEAD" -- changelog.d/)

          if [ "$harvested" = yes ] && [ -z "$added" ]; then
            echo "::error::a 'Bucket ::= ' commit on this branch adds no"
            echo "changelog.d/ fragment.  Run 'git harvest scan' and commit"
            echo "the result before merging."
            exit 1
          fi

          scan_dir="$RUNNER_TEMP/harvest"
          git harvest scan --base "$BASE" --output "$scan_dir"

          fresh=("$scan_dir"/*.ron)
          if [ ${#fresh[@]} -eq 0 ]; then
            echo "nothing to harvest; the fragment check passes"
            exit 0
          fi

          normalise() { sed -E 's/Some\("[0-9a-f]+"\)/Some(HASH)/g' "$1"; }
          want=$(normalise "${fresh[0]}")

          for committed in changelog.d/*.ron; do
            if [ "$(normalise "$committed")" = "$want" ]; then
              echo "a committed fragment matches a fresh scan of this branch"
              exit 0
            fi
          done

          echo "::error::'git harvest scan' finds entries that no committed"
          echo "changelog.d/ fragment carries -- the fragment is missing or"
          echo "stale.  Re-run 'git harvest scan' and commit it."
          echo '--- a fresh scan of this branch ---'
          cat "${fresh[0]}"
          exit 1

  renovate-licences:
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: rustup update

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: fregante/setup-git-user@024bc0b8e177d7e77203b48dab6fb45666854b35 # v2.0.2

      - name: refresh the shipped licence notices when the lock file moved
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          marker="Skip ::= refresh the shipped licence notices"
          since=$(git log --format='%H %s' "origin/$BASE..HEAD" |
                  grep -F " $marker" | head -n1 | cut -d' ' -f1 || true)
          since="${since:-origin/$BASE}"

          if git diff --quiet "$since" HEAD -- Cargo.lock; then
            echo "the lock file is unchanged since the last refresh"
            exit 0
          fi

          env -u CI cargo run -p xtask

          git add THIRDPARTY.md debian/copyright
          if git diff --cached --quiet; then
            echo "the notices already match the graph"
            exit 0
          fi

          git commit -m "$marker"
          git push

  gate:
    needs:
      - actionlint
      - cargo-deny
      - cargo-features
      - cffconvert
      - changelog-fragment
      - dependencies
      - formatting
      - msrv
      - release-level
      - renovate-linter
      - thirdparty
    runs-on: ubuntu-latest
    steps:
      - run: bash -c 'exit 0'

################################################################################
