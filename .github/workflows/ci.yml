name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  # The lints this crate cares about are denied in `src/lib.rs` rather than
  # on the command line, so `clippy` and `doc` fail on their own account.
  # `test` carries the conventions harness in `tests/conventions.rs`, which
  # is why no separate job runs a checker of its own.
  cargo-features:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: cargo ${{ matrix.subcommand }} ${{ matrix.feature }}
    strategy:
      matrix:
        feature:
          - ''
          - --features build
          - --features clap
          - --features build,clap
        subcommand:
          - build
          - clippy --all-targets
          - doc --no-deps
          - test

  # The headline claim of the runtime half, asserted rather than assumed:
  # the crate itself is the only line `cargo tree` has to print.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: |
          test "$(
            cargo tree --no-default-features --edges normal | wc -l
          )" -eq 1

  cffconvert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker://citationcff/cffconvert:2.0.0
        with:
          args: --validate -i CITATION.cff

  # The configuration this repository's dependency currency rests on.  Its
  # predecessor in `aeruginous-rs` had drifted onto a deprecated field name
  # without anything noticing, which is the whole argument for this job.
  renovate-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: |
          npx -p renovate \
              -c 'renovate-config-validator renovate.json --strict' \
              -y

  formatting:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: cargo fmt --check

  # One check to require of a pull request, so that adding a job here does
  # not mean editing the branch protection rule as well.
  gate:
    needs:
      - actionlint
      - cargo-features
      - cffconvert
      - dependencies
      - formatting
      - renovate-linter
    runs-on: ubuntu-latest
    steps:
      - run: bash -c 'exit 0'

################################################################################
