name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  cargo-features:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - name: checkout w/ tags
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: cargo ${{ matrix.subcommand }} ${{ matrix.feature }}
    strategy:
      matrix:
        feature:
          - ''
          - --features build
          - --features clap
          - --features compression
          - --features build,clap
          - --all-features
        subcommand:
          - build
          - clippy --all-targets
          - doc --no-deps
          - test

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: runtime half has no dependencies
        run: |
          test "$(
            cargo tree --no-default-features --edges normal | wc -l
          )" -eq 1

  cffconvert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker://citationcff/cffconvert:2.0.0
        with:
          args: --validate -i CITATION.cff

  renovate-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: |
          npx -p renovate \
              -c 'renovate-config-validator renovate.json --strict' \
              -y

  formatting:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: cargo fmt --check

  release-level:
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - name: checkout w/ tags
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: taiki-e/install-action@v2.87.6
        with:
          tool: cargo-semver-checks@0.50.0

      - run: |
          set -euo pipefail

          field() {
            awk -F'"' -v want="$1" '/^\[/ { s = $0 }
                 s == want && /^version = / { print $2; exit }'
          }

          level='patch'

          raise() {
            case "$1" in
              major) level=major ;;
              minor) [ "$level" = major ] || level=minor ;;
            esac
          }

          LAST="$(git describe --tags --abbrev=0)"
          BASE="${LAST#v}"
          echo "the baseline is $LAST"

          combos=(
            '--default-features'
            '--only-explicit-features --features clap'
            '--only-explicit-features --features compression'
            '--only-explicit-features --features clap,compression'
            '--only-explicit-features --features build'
            '--only-explicit-features --features build,clap'
            '--only-explicit-features --features build,compression'
            '--only-explicit-features --features build,clap,compression'
            '--only-explicit-features'
          )

          for combo in "${combos[@]}"; do
            echo "::group::cargo-semver-checks $combo"
            read -ra flags <<< "$combo"
            report="$(cargo semver-checks --baseline-rev "$LAST" \
                      --release-type patch "${flags[@]}" 2>&1 || true)"
            echo "$report"
            echo '::endgroup::'

            case "$report" in
              *'requires new major version'*) raise major ;;
              *'requires new minor version'*) raise minor ;;
              *'no semver update required'*) ;;
              *) echo 'no verdict from cargo-semver-checks'; exit 1 ;;
            esac
          done

          OLD_MSRV="$(git show "$LAST:Cargo.toml" |
                      awk -F'"' '/^rust-version = / { print $2; exit }')"
          NEW_MSRV="$(awk -F'"' '/^rust-version = / { print $2; exit }' \
                      Cargo.toml)"

          if [ "$OLD_MSRV" != "$NEW_MSRV" ] &&
             [ "$(printf '%s\n%s\n' "$OLD_MSRV" "$NEW_MSRV" |
                  sort -V | tail -1)" = "$NEW_MSRV" ]
          then
            echo "the minimum toolchain rose from $OLD_MSRV to $NEW_MSRV"
            raise minor
          fi

          OLD_CLAP="$(git show "$LAST:Cargo.toml" |
                      field '[dependencies.clap]' | cut -d. -f1 |
                      tr -cd '0-9')"
          NEW_CLAP="$(field '[dependencies.clap]' < Cargo.toml |
                      cut -d. -f1 | tr -cd '0-9')"

          if [ -n "$OLD_CLAP" ] && [ -n "$NEW_CLAP" ] &&
             [ "$NEW_CLAP" -gt "$OLD_CLAP" ]
          then
            echo "clap is required at $NEW_CLAP, was $OLD_CLAP"
            raise major
          fi

          IFS=. read -r MAJ MIN PAT <<< "$BASE"

          if [ "$MAJ" -eq 0 ]; then
            case "$level" in
              major) EXPECTED="0.$((MIN + 1)).0" ;;
              *) EXPECTED="0.$MIN.$((PAT + 1))" ;;
            esac
          else
            case "$level" in
              major) EXPECTED="$((MAJ + 1)).0.0" ;;
              minor) EXPECTED="$MAJ.$((MIN + 1)).0" ;;
              *) EXPECTED="$MAJ.$MIN.$((PAT + 1))" ;;
            esac
          fi

          ACTUAL="$(field '[package]' < Cargo.toml)"
          echo "$LAST plus a $level step is $EXPECTED; the manifest says"
          echo "$ACTUAL"

          if [ "$ACTUAL" = "$EXPECTED" ] || [ "$ACTUAL" = 1.0.0 ]; then
            exit 0
          fi

          echo "This change asks for a $level release over $BASE, so the"
          echo "manifest has to say $EXPECTED and says $ACTUAL instead."
          echo "Set the version of the package in Cargo.toml, the"
          echo "list-my-licence entry in Cargo.lock and the version field"
          echo "of CITATION.cff to $EXPECTED."
          exit 1

  changelog-fragment:
    runs-on: ubuntu-latest
    env:
      GIT_HARVEST_VERSION: "0.3.0"
    steps:
      - if: github.event_name == 'pull_request'
        run: rustup update

      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: github.event_name == 'pull_request'
        id: cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/git-harvest
          key: git-harvest-${{ env.GIT_HARVEST_VERSION }}-${{ runner.os }}

      - if: >-
          github.event_name == 'pull_request'
          && steps.cache.outputs.cache-hit != 'true'
        run: cargo install git-harvest --version "$GIT_HARVEST_VERSION" --locked

      - if: github.event_name == 'pull_request'
        name: a Bucket ::= commit is matched by a committed fragment
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          harvested=no
          while IFS= read -r subject; do
            case "$subject" in
              'Added ::= '* | 'Changed ::= '* | 'Deprecated ::= '* | \
              'Fixed ::= '* | 'Removed ::= '* | 'Security ::= '*)
                harvested=yes ;;
            esac
          done < <(git log --format='%s' "$BASE..$HEAD")

          added=$(git diff --diff-filter=A --name-only "$BASE...$HEAD" \
                  -- changelog.d/)

          if [ "$harvested" = yes ] && [ -z "$added" ]; then
            echo "::error::a 'Bucket ::= ' commit on this branch adds no"
            echo "changelog.d/ fragment.  Run 'git harvest scan' and commit"
            echo "the result before merging."
            exit 1
          fi

          scan_dir="$RUNNER_TEMP/harvest"
          git harvest scan --base "$BASE" --output "$scan_dir"

          fresh=("$scan_dir"/*.ron)
          if [ ${#fresh[@]} -eq 0 ]; then
            echo "nothing to harvest; the fragment check passes"
            exit 0
          fi

          normalise() { sed -E 's/Some\("[0-9a-f]+"\)/Some(HASH)/g' "$1"; }
          want=$(normalise "${fresh[0]}")

          for committed in changelog.d/*.ron; do
            if [ "$(normalise "$committed")" = "$want" ]; then
              echo "a committed fragment matches a fresh scan of this branch"
              exit 0
            fi
          done

          echo "::error::'git harvest scan' finds entries that no committed"
          echo "changelog.d/ fragment carries -- the fragment is missing or"
          echo "stale.  Re-run 'git harvest scan' and commit it."
          echo '--- a fresh scan of this branch ---'
          cat "${fresh[0]}"
          exit 1

  harvest-renovate:
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: fregante/setup-git-user@v2.0.2

      - name: record the dependency bump as a freely authored fragment
        env:
          BASE: ${{ github.base_ref }}
          LEAF: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          marker="Skip ::= record the dependency bump"
          if git log --format='%s' "origin/$BASE..HEAD" |
             grep -qxF "$marker"
          then
            echo "the fragment is already recorded"
            exit 0
          fi

          entry=$(printf '%s' "$TITLE" | sed -E 's/^\[Renovate\] +//')
          entry=$(printf '%s' "$entry" | sed -E 's/(["\\])/\\\1/g')
          head=$(printf '%s' "$entry" | cut -c1 | tr '[:upper:]' '[:lower:]')
          rest=$(printf '%s' "$entry" | cut -c2-)
          leaf=${LEAF##*/}
          stamp=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          file="changelog.d/${stamp}_${leaf}.ron"

          mkdir -p changelog.d
          {
            printf '(\n  references: {},\n  changes: {\n'
            printf '    "Changed": [\n'
            printf \
              '      (text: "%s%s", commit: None, aliases: %s),\n' \
              "$head" "$rest" '["renovate", "github-actions"]'
            printf '    ],\n  },\n)\n'
          } > "$file"

          git add "$file"
          git commit -m "$marker"
          git push

  gate:
    needs:
      - actionlint
      - cargo-features
      - cffconvert
      - changelog-fragment
      - dependencies
      - formatting
      - release-level
      - renovate-linter
    runs-on: ubuntu-latest
    steps:
      - run: bash -c 'exit 0'

################################################################################
