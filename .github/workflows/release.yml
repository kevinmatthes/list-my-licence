################################################################################

name: release

# Aeruginous releases on a push to `main` which edits its `.version` file.
# This crate has no such file:  the manifest already records the version,
# and a second copy of that fact would be free to drift from it.  The
# trigger is therefore the maintainer rather than a path.
on:
  workflow_dispatch:

permissions:
  contents: write

# Publication to crates.io is deliberately absent.  The first release is to
# be uploaded by hand;  the token secret, and the step which would spend it,
# follow once that has happened.
jobs:
  release:
    if: github.repository == 'kevinmatthes/list-my-licence'
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The manifest is the only source of the version, so the tag is read
      # from it instead of from a file kept alongside it.
      - id: manifest
        run: |
          echo "version=$(cargo metadata --format-version 1 --no-deps |
                jq -r '.packages[0].version')" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          tag_name: v${{ steps.manifest.outputs.version }}

################################################################################
