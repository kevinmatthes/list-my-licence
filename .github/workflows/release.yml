name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.repository == 'kevinmatthes/list-my-licence'
    runs-on: ubuntu-latest
    steps:
      - run: rustup update

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: read version from manifest
        id: manifest
        run: |
          echo "version=$(cargo metadata --format-version 1 --no-deps |
                jq -r '.packages[0].version')" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          tag_name: v${{ steps.manifest.outputs.version }}

      - id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.5

      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

################################################################################
