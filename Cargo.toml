[package]
name = "list-my-licence"
version = "0.1.1"
edition = "2024"
rust-version = "1.98.0"
description = "Embed verbatim dependency licences into a Rust binary."
repository = "https://github.com/kevinmatthes/list-my-licence"
license = "GPL-3.0-or-later"
authors = ["Kevin Matthes <aeruginous.rs@gmail.com>"]
# Both spellings are listed deliberately, so that a crates.io search finds
# this crate whichever one is used.
keywords = ["attribution", "compliance", "licence", "license", "spdx"]
categories = ["development-tools::build-utils"]
readme = "README.md"

# An allowlist, not a blocklist.  Cargo ignores `exclude` outright whenever
# `include` is given, and warns that it does;  the two cannot be combined.
# The allowlist is the better half of that choice anyway, because furniture
# added to the root later cannot silently reach the tarball.
#
# `LICENCE` is here on purpose.  A crate whose subject is the reproduction of
# licence texts should ship its own, and the terms are GPL.  `Cargo.toml`,
# `Cargo.lock` and the two files Cargo generates come along regardless.
#
# `tests/` is deliberately absent;  see the note in the session report.  The
# conventions harness shells out to `git ls-files`, so four of its six tests
# panic outside a checkout, and the repository's own conventions are no
# concern of anybody unpacking the tarball.  The documentation tests live in
# `src/` and still ship.
include = ["src/**", "README.md", "LICENCE"]

# How `cargo-release` moves the version.  The replacements exist because a
# version written in two places drifts:  `CITATION.cff` was left at 0.1.0
# while the manifest said 0.1.1.  `min` defaults to one occurrence, so a
# pattern which stops matching fails the release rather than passing over
# the field in silence, which is the whole reason to let a tool do this.
[package.metadata.release]
tag-name = "v{{version}}"

[[package.metadata.release.pre-release-replacements]]
file = "CITATION.cff"
search = "^date-released: ....-..-.."
replace = "date-released: {{date}}"

[[package.metadata.release.pre-release-replacements]]
file = "CITATION.cff"
search = "^version: .+\\..+\\..+"
replace = "version: {{version}}"

# The runtime half has no dependencies at all.  Everything below is optional
# and reachable only through the `build` feature, so a consuming crate names
# this crate twice:  once as a build-dependency with `features = ["build"]`,
# and once as a plain dependency.
[dependencies]
cargo_metadata = { version = "0.23.1", optional = true }
license = { version = "3.8.0", optional = true }
miniz_oxide = { version = "0.9.1", optional = true }
spdx = { version = "0.13.5", optional = true }

[dependencies.clap]
features = ["derive"]
optional = true
version = "4.6.6"

[features]
default = []
build = ["dep:cargo_metadata", "dep:license", "dep:spdx"]

# Command line plumbing for applications built with clap.  Additive:  it costs
# the runtime half its empty dependency list, which is why it is not default.
clap = ["dep:clap"]

# Compressed embedding.  Additive by construction:  `embed!` and
# `Licence` are untouched, so a build without this keeps its plain text
# and its empty dependency list.  A Cargo feature may not change a
# public type — two crates in one graph disagreeing about it would
# break — so this adds a parallel path rather than altering the one
# that exists.
compression = ["dep:miniz_oxide"]

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

[lints.rust]
dead_code = "deny"
deprecated = "deny"
missing_docs = "deny"
unreachable_code = "deny"
unused_assignments = "deny"
unused_imports = "deny"
unused_macros = "deny"
unused_must_use = "deny"
unused_mut = "deny"
unused_parens = "deny"
unused_variables = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

