[package]
name = "list-my-licence"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "Embed verbatim dependency licences into a Rust binary."
repository = "https://github.com/kevinmatthes/list-my-licence"
license = "GPL-3.0-or-later"
authors = ["Kevin Matthes <aeruginous.rs@gmail.com>"]
# Both spellings are listed deliberately, so that a crates.io search finds
# this crate whichever one is used.
keywords = ["attribution", "compliance", "licence", "license", "spdx"]
categories = ["development-tools::build-utils"]
readme = "README.md"

# The runtime half has no dependencies at all.  Everything below is optional
# and reachable only through the `build` feature, so a consuming crate names
# this crate twice:  once as a build-dependency with `features = ["build"]`,
# and once as a plain dependency.
[dependencies]
cargo_metadata = { version = "0.23.1", optional = true }
license = { version = "3.8.0", optional = true }
spdx = { version = "0.13.5", optional = true }

[features]
default = []
build = ["dep:cargo_metadata", "dep:license", "dep:spdx"]

[dev-dependencies]
tempfile = "3.27.0"

################################################################################
